   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="401.4" y="29.960466" transform="rotate(-0 401.4 29.960466)">ESDSA v2: Evidence-Constrained Assessment and Stability Gating</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="401.4" y="64.779839" transform="rotate(-0 401.4 64.779839)">Synthetic interview response</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="401.4" y="82.711581" transform="rotate(-0 401.4 82.711581)">Competency-specific rubric: three criteria</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="401.4" y="130.709087" transform="rotate(-0 401.4 130.709087)">Criterion-level evidence assessment</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="401.4" y="150.829284" transform="rotate(-0 401.4 150.829284)">POSITIVE / NEGATIVE / INSUFFICIENT</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="401.4" y="200.009087" transform="rotate(-0 401.4 200.009087)">Deterministic quotation traceability</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="401.4" y="219.319104" transform="rotate(-0 401.4 219.319104)">VERIFIED / CONTEXT_ONLY / UNVERIFIABLE / NOT_APPLICABLE</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="401.4" y="272.106417" transform="rotate(-0 401.4 272.106417)">Frozen evidence decision policy</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #637487" transform="translate(319.998469 286.379236)">Any verified negative: DO_NOT_ADVANCE</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #637487" transform="translate(331.157344 296.627704)">All three verified positive: ADVANCE</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #637487" transform="translate(366.184219 307.523329)">Otherwise: DEFER</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="129.375" y="268.043753" transform="rotate(-0 129.375 268.043753)">Semantic-equivalence annotation</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #637487" transform="translate(58.096875 287.789123)">Three variants per evidence condition</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #637487" transform="translate(87.936328 297.904748)">YES / NO / UNCERTAIN</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="401.4" y="344.995775" transform="rotate(-0 401.4 344.995775)">Apply frozen semantic stability policy</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="401.4" y="364.120108" transform="rotate(-0 401.4 364.120108)">Based on equivalence annotation and pre-stability decisions</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="180.99" y="425.206367" transform="rotate(-0 180.99 425.206367)">Equivalence = YES</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="180.99" y="446.020989" transform="rotate(-0 180.99 446.020989)">Unanimous identical actionable decision required</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="621.81" y="425.206367" transform="rotate(-0 621.81 425.206367)">Equivalence = NO or UNCERTAIN</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="621.81" y="446.020989" transform="rotate(-0 621.81 446.020989)">Retain individual pre-stability decisions</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="180.99" y="504.485567" transform="rotate(-0 180.99 504.485567)">Stable actionable recommendation</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #637487" transform="translate(96.685273 519.656986)">Retain ADVANCE or DO_NOT_ADVANCE;</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #637487" transform="translate(107.303633 531.648626)">otherwise DEFER all three variants</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243446" x="621.81" y="504.485567" transform="rotate(-0 621.81 504.485567)">Individual recommendations retained</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="621.81" y="525.106947" transform="rotate(-0 621.81 525.106947)">ADVANCE / DO_NOT_ADVANCE / DEFER</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637487" x="401.4" y="561.838359" transform="rotate(-0 401.4 561.838359)">Textual verification confirms excerpt occurrence, not semantic correctness. DEFER is an experimental assessment outcome.</text>
   </g>
